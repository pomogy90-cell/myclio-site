name: Finance regression
on:
  push:
    branches: [feature/finance-accounting]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
      - name: PHP lint
        run: php -l api/finance.php && php -l api/manage.php && php -l admin/index.php && php -l tests/finance-test.php
      - name: Finance regression
        run: php tests/finance-test.php
      - name: JavaScript syntax
        run: node --check manage/finance.js && node --check manage/manage.js
